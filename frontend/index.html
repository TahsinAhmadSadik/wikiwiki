<!doctype html>
<html lang="en">
  <head>
    <!-- Primary Meta Tags -->
    <title>WikiWiki - Explore the Collective Knowledge of Humanity</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="title" content="WikiWiki — Explore the Collective Knowledge of Humanity" />
    <meta name="description" content="A collaborative encyclopedia and documentation platform for curated topics, knowledge spaces, and community research." />

    <!-- Open Graph / Facebook / Discord / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wikiwiki-app.netlify.app/" />
    <meta property="og:title" content="WikiWiki — Explore the Collective Knowledge of Humanity" />
    <meta property="og:description" content="A collaborative encyclopedia and documentation platform for curated topics, knowledge spaces, and community research." />
    <meta property="og:image" content="https://wikiwiki-app.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://wikiwiki-app.netlify.app/" />
    <meta name="twitter:title" content="WikiWiki — Explore the Collective Knowledge of Humanity" />
    <meta name="twitter:description" content="A collaborative encyclopedia and documentation platform for curated topics, knowledge spaces, and community research." />
    <meta name="twitter:image" content="https://wikiwiki-app.netlify.app/og-image.png" />

    <!-- Theme Color for Mobile Browsers & Discord Embed Bar -->
    <meta name="theme-color" content="#a855f7" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
